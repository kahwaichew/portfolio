<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shelfwise — design mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Shelfwise design tokens — mirror the case study's design-system section */
  :root {
    --brand: #5f5af6; --brand-dark: #4f46e5; --brand-soft: #eeedfe;
    --ink: #0b1329; --text: #334155; --muted: #64748b; --subtle: #94a3b8;
    --surface: #f7f8fc; --card: #ffffff; --border: #e6e8f0;
    --positive: #12a150; --positive-soft: #e5f6ec; --warning: #d97706; --warning-soft: #fef3c7;
    --alert: #e5484d; --alert-soft: #fdecec;
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --font-display: 'Outfit', sans-serif; --font: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9dbe4; font-family: var(--font); color: var(--text); padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  .artboard { position: relative; overflow: hidden; background: var(--surface); flex: none; }
  h1, h2, h3, .display { font-family: var(--font-display); color: var(--ink); letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); }
  .overline { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* App shell */
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100%; }
  .side { background: var(--ink); color: #cbd5e1; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
  .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 20px; padding: 0 8px 24px; }
  .logo i { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; }
  .nav.on { background: rgba(255,255,255,.09); color: #fff; }
  .nav .count { margin-left: auto; background: var(--alert); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .side .spacer { flex: 1; }
  .me { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-size: 13px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--card); }
  .top h1 { font-size: 22px; margin-right: auto; }
  .control { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--text); background: #fff; }
  .search { width: 240px; color: var(--subtle); }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--brand); color: #fff; }
  .btn.ghost { background: var(--brand-soft); color: var(--brand-dark); }
  .content { padding: 28px 32px; display: grid; gap: 20px; overflow: hidden; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; }
  .card h3 { font-size: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .chip.alert { background: var(--alert-soft); color: #b42318; } .chip.warn { background: var(--warning-soft); color: #92400e; }
  .chip.ok { background: var(--positive-soft); color: #08743a; } .chip.neutral { background: #f1f5f9; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi { display: flex; flex-direction: column; gap: 6px; }
  .kpi .value { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .kpi .value small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .kpi .delta { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .up-bad { color: var(--alert); } .up-good { color: var(--positive); } .flat { color: var(--muted); }
  .bar-track { height: 6px; border-radius: 3px; background: #eef0f6; overflow: hidden; }
  .bar-track span { display: block; height: 100%; border-radius: 3px; background: var(--brand); }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); background: #fafbfd; }
  td { padding: 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  td strong { color: var(--ink); font-weight: 600; }
  tr.sel td { background: #f6f5ff; }
  .num { text-align: right; font-family: var(--mono); font-size: 12px; }

  /* Shelf photo placeholder (illustrated shelves, no real photos) */
  .shelf { border-radius: 12px; background: linear-gradient(#e8e2d6, #d9d1c1); padding: 10px; display: grid; gap: 8px; position: relative; }
  .shelf .tier { display: flex; gap: 4px; align-items: flex-end; height: 46px; border-bottom: 5px solid #9c8f78; padding: 0 4px; }
  .shelf .p { flex: 1; border-radius: 3px 3px 0 0; }
  .shelf .gap { flex: 1; height: 100%; background: repeating-linear-gradient(45deg, rgba(229,72,77,.18) 0 6px, rgba(229,72,77,.32) 6px 12px); border: 2px dashed #e5484d; border-radius: 4px; }
  .shelf .tag { position: absolute; left: 10px; bottom: 10px; background: rgba(11,19,41,.75); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; }

  /* Wireframes */
  .wf { background: #f4f4f5; }
  .wf .box { border: 1.5px dashed #c7c7cf; border-radius: 12px; background: #fff; color: #71717a; font-size: 13px; padding: 12px 14px; }
  .wf .solid { background: #a1a1aa; border: none; color: #fff; }
  .wf .line { height: 10px; border-radius: 5px; background: #e4e4e7; }

  /* Tablet */
  .tabbar { display: flex; justify-content: space-around; border-top: 1px solid var(--border); background: #fff; padding: 12px 0 22px; font-size: 12px; color: var(--subtle); }
  .tabbar div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tabbar .on { color: var(--brand); font-weight: 600; }
</style>
</head>
<body>
<!-- Artboards are filled in by the script below; each one is exported by design/render.mjs -->
<div id="boards"></div>
<script>
const I = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  store: '<path d="M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9 20v-6h6v6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a6 6 0 0 1 4 6.5"/>',
  file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pin: '<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  up: '<path d="M7 17 17 7M9 7h8v8"/>', dn: '<path d="M7 7l10 10M17 9v8H9"/>',
  alert: '<path d="M12 3 2 20h20zM12 10v4M12 17v.01"/>', box: '<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  camera: '<path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>',
  check: '<path d="M5 12l5 5 9-10"/>', filter: '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>', back: '<path d="m15 18-6-6 6-6"/>', more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
};
const icon = (n, style = '') => `<svg class="i" viewBox="0 0 24 24" style="${style}">${I[n]}</svg>`;
const NAV = [['grid', 'Overview'], ['store', 'Outlets'], ['users', 'Team'], ['file', 'Reports'], ['bell', 'Alerts', 7], ['cog', 'Settings']];
const shell = (active, title, actions, body) => `
  <div class="app">
    <aside class="side">
      <div class="logo"><i>${icon('box', 'stroke:#fff;width:16px;height:16px')}</i>Shelfwise</div>
      ${NAV.map(([ic, n, c]) => `<div class="nav ${n === active ? 'on' : ''}">${icon(ic)}${n}${c ? `<span class="count">${c}</span>` : ''}</div>`).join('')}
      <div class="spacer"></div>
      <div class="me"><span class="avatar" style="background:#7c3aed">ML</span><div><div style="color:#fff;font-weight:600">Mei Ling Tan</div><div style="font-size:12px">Brand manager</div></div></div>
    </aside>
    <div class="main">
      <div class="top"><h1>${title}</h1>${actions}</div>
      <div class="content">${body}</div>
    </div>
  </div>`;
const topControls = `<div class="control search">${icon('search')}Search outlets, SKUs…</div>
  <div class="control">${icon('cal')}Today, 26 Oct${icon('down', 'width:14px')}</div>
  <div class="control">${icon('pin')}All regions${icon('down', 'width:14px')}</div>
  <div class="btn">${icon('dl')}Export</div>`;

// ---- Line chart: visits per hour, today vs 7-day average (one axis, 2 series) ----
function lineChart(w, h) {
  const today = [12, 38, 64, 71, 58, 44, 52, 61, 49, 30, 14];
  const avg = [15, 34, 55, 62, 60, 50, 48, 53, 45, 33, 18];
  const pad = { l: 36, r: 12, t: 12, b: 26 }, max = 80;
  const x = i => pad.l + i * (w - pad.l - pad.r) / (today.length - 1);
  const y = v => pad.t + (1 - v / max) * (h - pad.t - pad.b);
  const path = d => d.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  let g = '';
  for (const v of [0, 20, 40, 60, 80]) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f6"/><text x="${pad.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#94a3b8">${v}</text>`;
  ['8am', '10am', '12pm', '2pm', '4pm', '6pm'].forEach((t, k) => { g += `<text x="${x(k * 2)}" y="${h - 6}" text-anchor="middle" font-size="11" fill="#94a3b8">${t}</text>`; });
  const area = `${path(today)}L${x(today.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z`;
  return `<svg width="${w}" height="${h}" font-family="Inter">${g}
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5f5af6" stop-opacity=".16"/><stop offset="1" stop-color="#5f5af6" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${path(avg)}" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${path(today)}" fill="none" stroke="#5f5af6" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="${x(7)}" x2="${x(7)}" y1="${pad.t}" y2="${y(0)}" stroke="#c7cbe0" stroke-dasharray="3 3"/>
    <circle cx="${x(7)}" cy="${y(61)}" r="5" fill="#5f5af6" stroke="#fff" stroke-width="2"/>
    <g transform="translate(${x(7) + 10},${y(61) - 46})"><rect width="128" height="44" rx="8" fill="#0b1329"/><text x="10" y="18" font-size="11" fill="#94a3b8">3pm · today</text><text x="10" y="35" font-size="13" font-weight="700" fill="#fff">61 visits (+15%)</text></g>
  </svg>`;
}
// ---- Horizontal bar chart: out-of-stock SKUs by category (single series, direct labels) ----
function barChart(w) {
  const d = [['Dairy', 12], ['Beverages', 9], ['Snacks', 7], ['Household', 5], ['Personal care', 3]];
  const max = 12, lw = 96, bh = 14, gap = 22;
  return `<svg width="${w}" height="${d.length * (bh + gap)}" font-family="Inter">${d.map(([n, v], i) => {
    const y = i * (bh + gap), bw = (w - lw - 36) * v / max;
    return `<text x="0" y="${y + 11}" font-size="12" fill="#334155">${n}</text>
      <rect x="${lw}" y="${y}" width="${w - lw - 36}" height="${bh}" rx="4" fill="#f1f2f8"/>
      <rect x="${lw}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="#5f5af6"/>
      <text x="${lw + bw + 8}" y="${y + 11}" font-size="12" font-weight="700" fill="#0b1329">${v}</text>`;
  }).join('')}</svg>`;
}
const kpi = (label, value, extra, delta, cls, pct) => `<div class="card kpi"><span class="overline">${label}</span>
  <span class="value">${value}${extra ? ` <small>${extra}</small>` : ''}</span>
  ${pct != null ? `<div class="bar-track"><span style="width:${pct}%"></span></div>` : ''}
  <span class="delta ${cls}">${icon(cls === 'flat' ? 'clock' : cls === 'up-bad' ? 'up' : 'up', 'width:14px;height:14px')}${delta}</span></div>`;
const shelfTier = (cols, gapAt = -1) => `<div class="tier">${cols.map((c, i) => i === gapAt ? '<div class="gap"></div>' : `<div class="p" style="background:${c};height:${70 + (i * 13) % 30}%"></div>`).join('')}</div>`;
const shelf = (label, gaps = []) => `<div class="shelf">
  ${shelfTier(['#f97316', '#f97316', '#fde047', '#fde047', '#38bdf8', '#38bdf8', '#38bdf8'], gaps[0] ?? -1)}
  ${shelfTier(['#e11d48', '#e11d48', '#22c55e', '#22c55e', '#22c55e', '#a855f7', '#a855f7'], gaps[1] ?? -1)}
  ${shelfTier(['#0ea5e9', '#0ea5e9', '#0ea5e9', '#f59e0b', '#f59e0b', '#64748b', '#64748b'], gaps[2] ?? -1)}
  <span class="tag">${label}</span></div>`;
const OUTLETS = [
  ['AEON Mid Valley', 'Klang Valley', 'Aisyah R.', 'Visited 09:42', 'ok', 0, '98%'],
  ['Lotus’s Bangsar South', 'Klang Valley', 'Daniel K.', 'Visited 10:15', 'alert', 3, '84%'],
  ['Giant Taman Universiti', 'Johor', 'Siti N.', 'In progress', 'warn', 1, '91%'],
  ['Mydin USJ', 'Klang Valley', 'Kumar S.', 'Visited 08:58', 'alert', 4, '79%'],
  ['AEON Bukit Indah', 'Johor', 'Lim W.', 'Scheduled 14:00', 'neutral', null, '—'],
  ['Econsave Melaka Raya', 'Melaka', 'Farah Z.', 'Visited 11:20', 'ok', 0, '96%'],
  ['Lotus’s Kepong', 'Klang Valley', 'Aisyah R.', 'Missed', 'alert', null, '—'],
  ['Giant Plentong', 'Johor', 'Siti N.', 'Visited 09:05', 'warn', 1, '93%'],
  ['Village Grocer KLCC', 'Klang Valley', 'Daniel K.', 'Visited 10:48', 'ok', 0, '99%']
];
const statusChip = (s, label) => `<span class="chip ${s}">${s === 'ok' ? icon('check', 'width:12px;height:12px') : '<span class="dot" style="background:currentColor"></span>'}${label}</span>`;

const boards = {
  overview: [1440, 900, () => shell('Overview', 'Good morning, Mei Ling', topControls, `
    <div class="kpis">
      ${kpi('Outlet coverage', '87%', '412 / 474', '+4 pts vs. last Mon', 'up-good', 87)}
      ${kpi('Out-of-stock', '23', 'SKUs · 41 outlets', '+6 since yesterday', 'up-bad')}
      ${kpi('Planogram compliance', '92%', '', '+1.5 pts this week', 'up-good', 92)}
      ${kpi('Team on duty', '58', '/ 64', '6 not clocked in', 'flat')}
    </div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:20px">
      <div class="card"><div class="row between" style="margin-bottom:12px"><div><h3>Outlet visits by hour</h3><span style="font-size:12px;color:var(--muted)">Today vs. 7-day average</span></div>
        <div class="row" style="font-size:12px;gap:16px"><span class="row" style="gap:6px"><span class="dot" style="background:#5f5af6"></span>Today</span><span class="row" style="gap:6px"><span style="width:14px;border-top:2px dashed #94a3b8"></span>7-day avg</span></div></div>
        ${lineChart(640, 250)}</div>
      <div class="card"><div class="row between" style="margin-bottom:18px"><div><h3>Out-of-stock by category</h3><span style="font-size:12px;color:var(--muted)">Out-of-stock flags today, by category</span></div><span class="chip alert">36 flags</span></div>${barChart(380)}</div>
    </div>
    <div class="card" style="padding:0">
      <div class="row between" style="padding:16px 20px"><h3>Needs attention</h3><span style="font-size:13px;font-weight:600;color:var(--brand)">View all outlets →</span></div>
      <table><tr><th>Outlet</th><th>Region</th><th>Issue</th><th>Merchandiser</th><th>Last visit</th><th></th></tr>
      <tr><td><strong>Mydin USJ</strong></td><td>Klang Valley</td><td>${statusChip('alert', '4 SKUs out of stock')}</td><td>Kumar S.</td><td>08:58</td><td class="num">${icon('more')}</td></tr>
      <tr><td><strong>Lotus’s Kepong</strong></td><td>Klang Valley</td><td>${statusChip('alert', 'Visit missed')}</td><td>Aisyah R.</td><td>Yesterday</td><td class="num">${icon('more')}</td></tr>
      </table></div>`)],

  outlets: [1440, 900, () => shell('Outlets', 'Outlets', topControls, `
    <div class="row" style="gap:8px">
      <span class="chip" style="background:var(--ink);color:#fff;padding:6px 14px">All 474</span>
      <span class="chip alert" style="padding:6px 14px">Out of stock · 41</span>
      <span class="chip warn" style="padding:6px 14px">Low compliance · 18</span>
      <span class="chip neutral" style="padding:6px 14px">Not visited · 62</span>
      <span style="margin-left:auto" class="control">${icon('filter')}Client: All${icon('down', 'width:14px')}</span>
      <span class="control">Sort: Most urgent${icon('down', 'width:14px')}</span>
    </div>
    <div class="card" style="padding:0">
      <table><tr><th>Outlet</th><th>Region</th><th>Merchandiser</th><th>Visit status</th><th>Out of stock</th><th>Compliance</th><th>Shelf photos</th></tr>
      ${OUTLETS.map((o, i) => `<tr class="${i === 1 ? 'sel' : ''}"><td><strong>${o[0]}</strong></td><td>${o[1]}</td><td><span class="row" style="gap:8px"><span class="avatar" style="width:26px;height:26px;font-size:10px;background:${['#5f5af6', '#0ea5e9', '#e11d48', '#f59e0b', '#12a150'][i % 5]}">${o[2].split(' ').map(s => s[0]).join('')}</span>${o[2]}</span></td>
        <td>${statusChip(o[4] === 'alert' && o[5] == null ? 'alert' : o[3].startsWith('Visited') ? 'ok' : o[3] === 'In progress' ? 'warn' : 'neutral', o[3])}</td>
        <td>${o[5] == null ? '<span style="color:var(--subtle)">—</span>' : o[5] === 0 ? '<span style="color:var(--positive);font-weight:600">None</span>' : `<span class="chip ${o[5] > 2 ? 'alert' : 'warn'}">${o[5]} SKU${o[5] > 1 ? 's' : ''}</span>`}</td>
        <td class="num" style="text-align:left">${o[6]}</td>
        <td><span class="row" style="gap:4px">${o[5] == null ? '<span style="color:var(--subtle)">—</span>' : [0, 1, 2].map(k => `<span style="width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,${['#e8e2d6', '#d9d1c1', '#c9bfa9'][k]},#b9ae97)"></span>`).join('')}</span></td></tr>`).join('')}
      </table>
      <div class="row between" style="padding:14px 20px;font-size:13px;color:var(--muted)"><span>Showing 1–9 of 474 outlets</span><span class="row" style="gap:6px"><span class="control">Previous</span><span class="control">Next</span></span></div>
    </div>`)],
