<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jalan — design mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
  /* Jalan design tokens — mirror the case study's design-system section */
  :root {
    --primary: #d9482b; --primary-dark: #b93a20; --primary-soft: #fde9e3;
    --teal: #0f6e6e; --teal-soft: #ddf0ee; --sun: #e8a33d; --sun-soft: #fdf1dc; --violet: #6d5bd0; --violet-soft: #ece9fb;
    --ink: #1e2230; --text: #3f4555; --muted: #6b7182; --subtle: #a3a8b5;
    --sand: #fbf7f2; --card: #ffffff; --border: #ece6dd; --line: #f3eee7;
    --chart-stay: #00968f; --chart-food: #d9482b; --chart-transport: #e8a33d; --chart-fun: #6d5bd0;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --display: 'Bricolage Grotesque', sans-serif; --font: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d8d2c8; font-family: var(--font); color: var(--text); padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  .artboard { position: relative; overflow: hidden; background: var(--sand); flex: none; }
  h1, h2, h3, .display { font-family: var(--display); color: var(--ink); letter-spacing: -0.02em; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .col { display: flex; flex-direction: column; }
  .muted { color: var(--muted); }
  .overline { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 14px; height: 14px; } svg.i.lg { width: 22px; height: 22px; }

  /* Phone shell */
  .phone { width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--sand); }
  .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 34px; font-weight: 700; font-size: 15px; color: var(--ink); flex: none; }
  .status .sig { display: flex; gap: 5px; align-items: center; }
  .status .sig i { display: block; width: 3px; border-radius: 1px; background: var(--ink); }
  .status .bat { width: 25px; height: 12px; border: 1.5px solid var(--ink); border-radius: 4px; padding: 1.5px; margin-left: 4px; }
  .status .bat span { display: block; height: 100%; width: 75%; background: var(--ink); border-radius: 1.5px; }
  .screen { flex: 1; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; min-height: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: grid; place-items: center; color: var(--ink); }
  .tabbar { height: 84px; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--border); padding: 10px 8px 0; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--subtle); }
  .tab.on { color: var(--primary); }
  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); }

  /* Controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 16px; font-size: 16px; font-weight: 700; background: var(--primary); color: #fff; }
  .btn.block { width: 100%; }
  .btn.sec { background: var(--card); color: var(--ink); border: 1.5px solid var(--border); }
  .btn.ghost { background: var(--primary-soft); color: var(--primary-dark); }
  .btn.small { height: 38px; font-size: 14px; border-radius: 12px; padding: 0 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; color: var(--text); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .tag.teal { background: var(--teal-soft); color: var(--teal); } .tag.sun { background: var(--sun-soft); color: #8a5a0f; }
  .tag.violet { background: var(--violet-soft); color: #4b3ca8; } .tag.coral { background: var(--primary-soft); color: var(--primary-dark); }
  .tag.plain { background: #f1ede7; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); }
  .field { height: 52px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--subtle); font-size: 15px; }
  .toggle { width: 44px; height: 26px; border-radius: 13px; background: #ddd6cc; position: relative; flex: none; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle.on { background: var(--teal); } .toggle.on::after { left: 21px; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper b { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); display: grid; place-items: center; color: var(--ink); background: #fff; }
  .stepper span { width: 14px; text-align: center; font-weight: 700; color: var(--ink); font-size: 16px; }
  .progress { display: flex; gap: 6px; } .progress i { flex: 1; height: 4px; border-radius: 2px; background: #e6dfd4; } .progress i.on { background: var(--primary); }

  /* Source badges (platform initials, no logos) */
  .src { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; flex: none; font-family: var(--display); }

  /* Illustrated place thumbnails (no photos) */
  .thumb { border-radius: 14px; flex: none; position: relative; overflow: hidden; }
  .t-bamboo { background: repeating-linear-gradient(90deg, #5d9b4f 0 7px, #7fb36a 7px 12px, #3f7a3a 12px 16px, #9cc483 16px 22px); }
  .t-torii { background: linear-gradient(180deg, #f6d9b8, #f2c39a); }
  .t-torii::before { content: ''; position: absolute; left: 22%; right: 22%; top: 26%; height: 9%; background: #d9482b; border-radius: 2px; box-shadow: 0 7px 0 -2px #d9482b; }
  .t-torii::after { content: ''; position: absolute; left: 30%; right: 30%; top: 30%; bottom: 0; border-left: 5px solid #c23d23; border-right: 5px solid #c23d23; }
  .t-garden { background: radial-gradient(circle at 70% 70%, #86b9a8 0 22%, transparent 23%), radial-gradient(circle at 30% 40%, #5e9f88 0 18%, transparent 19%), linear-gradient(#cfe6dc, #a9d2c4); }
  .t-ramen { background: radial-gradient(circle at 50% 58%, #f7d48f 0 26%, #c9772d 27% 34%, #fff 35% 40%, transparent 41%), #f3e3cf; }
  .t-train { background: linear-gradient(180deg, #bfd9ee 0 55%, #87a96c 55%); }
  .t-train::after { content: ''; position: absolute; left: 12%; right: 12%; top: 40%; height: 26%; border-radius: 6px; background: #b8452f; box-shadow: inset 0 -5px 0 #8c3322; }
  .t-fish { background: radial-gradient(circle at 35% 45%, #f6c45c 0 9%, transparent 10%), radial-gradient(circle at 65% 62%, #f08d5e 0 7%, transparent 8%), linear-gradient(#3e88b8, #1f5a85); }
  .t-castle { background: linear-gradient(180deg, #d9e8f3 0 62%, #9cbf86 62%); }
  .t-castle::after { content: ''; position: absolute; left: 32%; right: 32%; top: 24%; bottom: 38%; background: #f5f2ea; border-top: 6px solid #2f6f6b; }

  /* Itinerary timeline */
  .stop { display: grid; grid-template-columns: 44px 1fr; gap: 12px; }
  .stop .time { font-weight: 700; color: var(--ink); font-size: 13px; padding-top: 12px; }
  .stop .body { display: flex; gap: 12px; padding: 12px; }
  .stop h4 { font-family: var(--display); font-size: 16px; color: var(--ink); letter-spacing: -.01em; }
  .leg { display: grid; grid-template-columns: 44px 1fr; gap: 12px; height: 30px; }
  .leg .rail { justify-self: center; border-left: 2px dashed #d8cfc2; }
  .leg .info { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .from { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .from i { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 8px; font-weight: 800; }

  /* Bottom sheet */
  .scrim { position: absolute; inset: 0; background: rgba(30,34,48,.45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 28px 28px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 14px; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #e2dbd0; align-self: center; }
  .option { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; border: 1.5px solid var(--border); }
  .option.on { border-color: var(--teal); background: #f4fbfa; }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--subtle); flex: none; }
  .radio.on { border: 7px solid var(--teal); }
  .col > .tag { align-self: flex-start; }

  /* Wireframes */
  .wire { background: #fafafa; }
  .wire .status { color: #555; } .wire .status .sig i, .wire .status .bat span { background: #555; } .wire .status .bat { border-color: #555; }
  .w { background: #e4e4e4; border-radius: 8px; } .w.dark { background: #bdbdbd; } .w.line { height: 10px; border-radius: 5px; }
  .w.box { border: 2px dashed #c4c4c4; background: transparent; }
  .wnote { position: absolute; background: #fff3a6; color: #5c4b00; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.12); width: 150px; line-height: 1.35; transform: rotate(-2deg); }

  /* Desktop */
  .desk { display: grid; grid-template-columns: 76px 520px 1fr; height: 100%; }
  .rail-nav { background: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 0; }
  .rail-nav a { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #9aa0b2; }
  .rail-nav a.on { background: rgba(255,255,255,.1); color: #fff; }
  .logo-mark { width: 44px; height: 44px; border-radius: 14px; background: var(--primary); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; margin-bottom: 16px; }

  /* Flow diagram */
  .node { position: absolute; background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 14px 16px; width: 190px; }
  .node h5 { font-family: var(--display); font-size: 16px; color: var(--ink); margin-top: 6px; }
  .node p { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .node .n { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; }
  .node.alt { border-style: dashed; background: #fffaf3; }
  .node.alt .n { background: var(--sun); }
  .lane { position: absolute; left: 40px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .swatch { width: 100%; height: 70px; border-radius: 14px; }
  .sheet-title { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
</style>
</head>
<body>
<div id="boards" style="display:contents"></div>
<script>
const ICONS = {
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
  map: '<path d="M14.1 5.55a2 2 0 0 0 1.79 0l3.66-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.55 2.27a2 2 0 0 1-1.8 0l-4.2-2.1a2 2 0 0 0-1.8 0l-3.65 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9L8.1 3.45a2 2 0 0 1 1.8 0z"/><path d="M15 5.76v15M9 3.24v15"/>',
  bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  sparkles: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/>',
  walk: '<path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>',
  train: '<rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16M12 3v8M8 19l-2 3M18 22l-2-3"/><path d="M8 15h.01M16 15h.01"/>',
  baby: '<path d="M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  swap: '<path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>',
  plus: '<path d="M5 12h14M12 5v14"/>', minus: '<path d="M5 12h14"/>', check: '<path d="M20 6 9 17l-5-5"/>',
  right: '<path d="m9 18 6-6-6-6"/>', left: '<path d="m15 18-6-6 6-6"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  spin: '<path d="M21 12a9 9 0 1 1-6.22-8.56"/>', search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  wifi: '<path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0"/>',
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;

const SOURCES = { tiktok: ['#111318', 'Tk'], insta: ['#b5317a', 'Ig'], maps: ['#1a73e8', 'Mp'], youtube: ['#d4211b', 'Yt'], blog: ['#6b7182', 'Bl'], xhs: ['#e3263f', 'Xh'] };
const src = (k, size = 40) => `<div class="src" style="background:${SOURCES[k][0]};width:${size}px;height:${size}px;font-size:${size * .33}px">${SOURCES[k][1]}</div>`;
const from = (k, label) => `<span class="from"><i style="background:${SOURCES[k][0]}">${SOURCES[k][1]}</i>${label}</span>`;

const status = () => `<div class="status"><span>9:41</span><span class="sig">${[5, 8, 11, 14].map(h => `<i style="height:${h}px"></i>`).join('')}<span style="margin-left:5px;display:flex">${ic('wifi', 'sm')}</span><span class="bat"><span></span></span></span></div>`;
const tabbar = (on) => `<nav class="tabbar">${[['route', 'Trip'], ['map', 'Map'], ['wallet', 'Budget'], ['bookmark', 'Saved']].map(([i, l]) => `<div class="tab ${l === on ? 'on' : ''}">${ic(i, 'lg')}${l}</div>`).join('')}</nav>`;
const phone = (inner, { tab, extra = '', bg } = {}) => `<div class="phone" ${bg ? `style="background:${bg}"` : ''}>${status()}<div class="screen">${inner}</div>${tab ? tabbar(tab) : ''}</div>${extra}<div class="home-ind"></div>`;

/* ---------- Stylised map (SVG, no real tiles) ---------- */
const mapSvg = (w, h, pins, { route = true } = {}) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
  <rect width="${w}" height="${h}" fill="#efe9dd"/>
  <path d="M${-20} ${h * .62} C ${w * .25} ${h * .5}, ${w * .35} ${h * .85}, ${w * .62} ${h * .7} S ${w * .9} ${h * .45}, ${w + 20} ${h * .5}" stroke="#bcd8e6" stroke-width="${Math.max(18, w * .045)}" fill="none"/>
  <ellipse cx="${w * .22}" cy="${h * .28}" rx="${w * .16}" ry="${h * .13}" fill="#d3e5c4"/>
  <ellipse cx="${w * .8}" cy="${h * .2}" rx="${w * .12}" ry="${h * .09}" fill="#d3e5c4"/>
  <ellipse cx="${w * .7}" cy="${h * .88}" rx="${w * .18}" ry="${h * .08}" fill="#d3e5c4"/>
  ${[.18, .42, .66, .86].map(f => `<path d="M0 ${h * f} L ${w} ${h * (f + .06)}" stroke="#fff" stroke-width="7"/>`).join('')}
  ${[.14, .38, .58, .82].map(f => `<path d="M${w * f} 0 L ${w * (f + .05)} ${h}" stroke="#fff" stroke-width="7"/>`).join('')}
  ${route ? `<path d="M ${pins.map(p => `${p[0] * w} ${p[1] * h}`).join(' L ')}" stroke="#d9482b" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round" fill="none"/>` : ''}
  ${pins.map((p, i) => `<g transform="translate(${p[0] * w} ${p[1] * h})"><circle r="17" fill="#fff"/><circle r="14" fill="${p[2] || '#d9482b'}"/><text y="5" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="14" fill="#fff">${p[3] ?? i + 1}</text></g>`).join('')}
</svg>`;
const DAY2 = [[.18, .3], [.34, .42], [.52, .36], [.66, .5], [.8, .34]];

/* ---------- Shared pieces ---------- */
const stop = (time, thumb, title, meta, tags, note = '') => `<div class="stop"><div class="time">${time}</div>
  <div class="card body"><div class="thumb ${thumb}" style="width:58px;height:58px"></div>
  <div class="col" style="gap:5px;min-width:0"><h4>${title}</h4>${meta}<div class="row" style="gap:5px;flex-wrap:wrap">${tags}</div>${note}</div></div></div>`;
const leg = (icon, text) => `<div class="leg"><div class="rail"></div><div class="info">${ic(icon, 'sm')}${text}</div></div>`;

const boards = {
  /* ---------- 1. Import links ---------- */
  import: [390, 844, () => phone(`
    <div class="topbar"><div class="iconbtn">${ic('left')}</div><span class="overline">Step 1 of 3</span><div style="width:40px"></div></div>
    <div class="progress"><i class="on"></i><i></i><i></i></div>
    <div><h1 style="font-size:30px;line-height:1.1">Drop in everything<br>you’ve saved</h1>
    <p class="muted" style="margin-top:8px;font-size:15px;line-height:1.45">Videos, reels, map lists, blogs. Jalan pulls out the places for you.</p></div>
    <div class="field" style="border-color:var(--primary);color:var(--ink)">${ic('link')}<span style="flex:1">tiktok.com/@mumgoesjapan/…</span><span style="color:var(--primary);font-weight:700;font-size:14px">Add</span></div>
    <div class="col" style="gap:10px">

    <svg width="1600" height="560" style="position:absolute;inset:0"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b9ad9c"/></marker></defs>
      ${nodes.slice(0, -1).map(n => `<path d="M${n[1] + 192} 160 L ${n[1] + 246} 160" stroke="#b9ad9c" stroke-width="2" marker-end="url(#ar)"/>`).join('')}
      <path d="M635 250 L 635 370" stroke="#b9ad9c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/>
      <path d="M730 430 C 790 430, 840 300, 868 252" stroke="#b9ad9c" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#ar)"/>
      <path d="M1385 250 L 1385 370" stroke="#b9ad9c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/>
      <path d="M1290 430 C 1220 430, 1170 330, 1150 252" stroke="#b9ad9c" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#ar)"/>
    </svg>
    ${nodes.map(([n, x, t, d]) => `<div class="node" style="left:${x}px;top:80px"><span class="n">${n}</span><h5>${t}</h5><p>${d}</p></div>`).join('')}
    <div class="node alt" style="left:540px;top:372px"><span class="n">!</span><h5>Unclear place</h5><p>Ask the user to confirm, e.g. “Which Nishiki: market or restaurant?”</p></div>
    <div class="node alt" style="left:1290px;top:372px"><span class="n">!</span><h5>Stop doesn’t fit</h5><p>Flag why (stairs, budget, hours) and offer 3 swaps.</p></div>
    <div style="position:absolute;right:40px;top:40px" class="row"><span class="tag plain" style="font-size:13px;padding:6px 12px">${ic('clock', 'sm')} Target: links to plan in under 2 minutes</span></div>`;
  }],

  /* ---------- Components ---------- */
  components: [1600, 760, () => `<div style="position:absolute;inset:0;padding:48px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px">
    <div class="card" style="padding:24px"><div class="sheet-title">Colour</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        ${[['Primary', '#D9482B'], ['Teal', '#0F6E6E'], ['Ink', '#1E2230'], ['Sun', '#E8A33D'], ['Violet', '#6D5BD0'], ['Sand', '#FBF7F2']].map(([n, h]) => `<div><div class="swatch" style="background:${h};${h === '#FBF7F2' ? 'border:1px solid var(--border)' : ''}"></div><b style="display:block;margin-top:6px;font-size:13px;color:var(--ink)">${n}</b><span class="muted" style="font-size:12px">${h}</span></div>`).join('')}
      </div>
      <div class="sheet-title" style="margin-top:26px">Budget chart (colour-blind checked)</div>
      <div class="row" style="gap:2px;height:14px">${[['--chart-stay', 40], ['--chart-food', 16], ['--chart-transport', 11], ['--chart-fun', 13]].map(([c, w]) => `<div style="height:100%;width:${w}%;background:var(${c});border-radius:4px"></div>`).join('')}<div style="flex:1;height:100%;border-radius:4px;background:repeating-linear-gradient(135deg,#ece5da 0 4px,#f6f1ea 4px 8px)"></div></div>
      <div class="row muted" style="gap:14px;margin-top:10px;font-size:12px;flex-wrap:wrap">${[['Stay', '--chart-stay'], ['Food', '--chart-food'], ['Transport', '--chart-transport'], ['Activities', '--chart-fun'], ['Buffer']].map(([n, c]) => `<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${c ? `var(${c})` : '#ece5da'}"></i>${n}</span>`).join('')}</div>
      <div class="sheet-title" style="margin-top:26px">Type</div>
      <div class="col" style="gap:8px">
        <div class="display" style="font-size:34px;font-weight:800">Bricolage 34</div>
        <div class="display" style="font-size:24px;font-weight:700">Screen title 24</div>
        <div class="display" style="font-size:16px;font-weight:700">Card title 16</div>
        <div style="font-size:15px">DM Sans body 15, for reading at arm’s length</div>
        <div class="overline">Overline 11</div></div>
    </div>
    <div class="card" style="padding:24px"><div class="sheet-title">Buttons</div>
      <div class="col" style="gap:10px"><div class="btn">${ic('sparkles')} Primary</div><div class="row" style="gap:10px"><div class="btn sec" style="flex:1">Secondary</div><div class="btn ghost" style="flex:1">Ghost</div></div><div class="row" style="gap:10px"><div class="btn small">Small</div><div class="btn small sec">${ic('swap', 'sm')} Swap</div><div class="btn" style="opacity:.4;height:38px;font-size:14px;border-radius:12px">Disabled</div></div></div>
      <div class="sheet-title" style="margin-top:26px">Chips & tags</div>
      <div class="row" style="gap:8px;flex-wrap:wrap"><span class="chip">Default</span><span class="chip on">Selected</span><span class="chip">${ic('plus', 'sm')} Add</span></div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:12px"><span class="tag teal">Stroller OK</span><span class="tag violet">Senior-friendly</span><span class="tag sun">Halal</span><span class="tag coral">4 km of stairs</span><span class="tag plain">Neutral</span></div>
      <div class="sheet-title" style="margin-top:26px">Inputs</div>
      <div class="col" style="gap:12px"><div class="field">${ic('link')} Paste a link</div><div class="field" style="border-color:var(--primary);color:var(--ink)">${ic('link')} tiktok.com/@…<span style="margin-left:auto;color:var(--primary);font-weight:700;font-size:14px">Add</span></div>
        <div class="row between"><div class="stepper"><b>${ic('minus', 'sm')}</b><span>2</span><b>${ic('plus', 'sm')}</b></div><div class="row" style="gap:10px"><span class="toggle"></span><span class="toggle on"></span></div><div class="row" style="gap:8px"><span class="radio"></span><span class="radio on"></span></div></div></div>
    </div>
    <div class="card" style="padding:24px"><div class="sheet-title">Link card states</div>
      <div class="col" style="gap:10px">
        <div class="card row" style="padding:10px 12px;border-radius:16px">${src('xhs')}<div class="col" style="flex:1;gap:2px"><b style="color:var(--ink);font-size:14px">Reading link</b><span class="muted" style="font-size:12.5px">Finding places…</span></div><span style="color:var(--primary)">${ic('spin')}</span></div>
        <div class="card row" style="padding:10px 12px;border-radius:16px">${src('maps')}<div class="col" style="flex:1;gap:2px"><b style="color:var(--ink);font-size:14px">Done</b><span style="font-size:12.5px;color:var(--teal);font-weight:600">9 places</span></div><span style="color:var(--teal)">${ic('check')}</span></div>
        <div class="card row" style="padding:10px 12px;border-radius:16px;border-color:#f2c9bd;background:#fff8f6">${src('blog')}<div class="col" style="flex:1;gap:2px"><b style="color:var(--ink);font-size:14px">No places found</b><span style="font-size:12.5px;color:var(--primary-dark);font-weight:600">Add them by hand</span></div><span style="color:var(--primary)">${ic('alert')}</span></div>
      </div>
      <div class="sheet-title" style="margin-top:26px">Itinerary stop + travel leg</div>
      ${stop('08:30', 't-bamboo', 'Bamboo Grove', from('tiktok', 'From a saved video'), '<span class="tag teal">Stroller OK</span>')}
      ${leg('walk', '8 min walk · flat path')}
      <div class="stop"><div class="time">13:00</div><div class="row" style="gap:10px;padding:12px 14px;border-radius:20px;border:1.5px dashed #d9cdbc;background:#fffaf2;color:var(--ink);font-weight:600;font-size:14px">${ic('moon')} Rest break</div></div>
    </div></div>`],

  /* ---------- Covers ---------- */
  cover: [1600, 900, () => `<div style="position:absolute;inset:0;background:linear-gradient(135deg,#c23d23 0%,#e2603a 50%,#f0a24a 100%)"></div>
    <div style="position:absolute;right:-220px;top:-300px;width:900px;height:900px;border-radius:50%;background:rgba(255,255,255,.08)"></div>
    <div style="position:absolute;left:110px;top:240px;width:450px;color:#fff">
      <div class="row" style="gap:8px">${['Mobile-first web app', 'UX case study'].map(c => `<span style="padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600">${c}</span>`).join('')}</div>
      <div class="display" style="font-size:124px;font-weight:800;color:#fff;margin-top:16px;line-height:1">Jalan</div>
      <div class="display" style="font-size:23px;font-weight:600;color:#fff1e8;margin-top:18px;line-height:1.35">Turn the places you’ve saved into a trip plan that fits everyone coming along.</div>
    </div>
    ${[['import', 640, 175, -6], ['itinerary', 935, 105, 0], ['swap', 1230, 175, 6]].map(([n, x, y, r]) => `<img src="../public/work/jalan/${n}.png" style="position:absolute;left:${x}px;top:${y}px;width:320px;border-radius:40px;transform:rotate(${r}deg);box-shadow:0 30px 60px rgba(90,25,10,.35)">`).join('')}`],
};
const host = document.getElementById('boards');
for (const [id, [w, h, render]] of Object.entries(boards)) {
  const el = document.createElement('section');
  el.className = 'artboard'; el.id = id; el.style.width = `${w}px`; el.style.height = `${h}px`;
  el.innerHTML = render();
  host.appendChild(el);
}
</script>
</body>
</html>
