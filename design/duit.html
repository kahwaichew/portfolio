<!doctype html>

<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9dbe4; font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px; }

<body>
<section class="artboard" id="cover" style="width:1600px;height:900px">

  <img src="../public/work/duit/pay.png" style="position:absolute;left:1230px;top:175px;width:320px;border-radius:40px;transform:rotate(6deg);box-shadow:0 30px 60px rgba(2,50,38,.35)">
